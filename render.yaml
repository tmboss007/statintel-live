services:
  - type: web
    name: statintel
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic upgrade head || true; uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: ChangeMe-Now-123!
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
